name: Windows Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build_windows_x64:
    name: windows-x64
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Fetch WinRing0 driver if missing
        shell: pwsh
        run: |
          $sys = "bin/WinRing0/WinRing0x64.sys"
          if (-not (Test-Path $sys)) {
            New-Item -ItemType Directory -Force -Path "bin/WinRing0" | Out-Null
            Invoke-WebRequest -Uri "https://github.com/xmrig/xmrig/raw/master/bin/WinRing0/WinRing0x64.sys" -OutFile $sys
          }

      - name: Checkout dependencies
        run: git clone --depth 1 https://github.com/xmrig/xmrig-deps.git

      - name: Configure
        run: >
          cmake -S . -B build
          -G "Visual Studio 17 2022" -A x64
          -DXMRIG_DEPS=${{ github.workspace }}/xmrig-deps/msvc2022/x64

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Smoke test
        run: .\build\Release\xmrig.exe --version

      - name: Package
        shell: pwsh
        run: |
          $version = [regex]::Match((Get-Content src/version.h -Raw), '#define APP_VERSION\s+"([^"]+)"').Groups[1].Value
          if (-not $version) { $version = "dev" }
          $name = "xmrig-$version-windows-x64"
          $out = Join-Path "dist" $name
          New-Item -ItemType Directory -Force -Path $out | Out-Null

          Copy-Item "build\Release\xmrig.exe" $out
          Copy-Item "src\config.json" $out
          Copy-Item "LICENSE" $out

          foreach ($f in @("build\Release\WinRing0x64.sys", "bin\WinRing0\WinRing0x64.sys")) {
            if (Test-Path $f) {
              Copy-Item $f $out
              break
            }
          }
          if (Test-Path "bin\WinRing0\LICENSE") {
            Copy-Item "bin\WinRing0\LICENSE" (Join-Path $out "WinRing0-LICENSE")
          }

          foreach ($cmd in @(
            "benchmark_1M.cmd",
            "benchmark_10M.cmd",
            "pool_mine_example.cmd",
            "solo_mine_example.cmd",
            "rtm_ghostrider_example.cmd"
          )) {
            $src = Join-Path "build\Release" $cmd
            if (-not (Test-Path $src)) { $src = Join-Path "scripts" $cmd }
            if (Test-Path $src) { Copy-Item $src $out }
          }

          $zip = Join-Path "dist" "$name.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path (Join-Path $out "*") -DestinationPath $zip -Force
          Get-ChildItem $zip | Format-Table Name, Length

      - uses: actions/upload-artifact@v4
        with:
          name: xmrig-windows-x64
          path: dist/*.zip

  release:
    name: GitHub Release
    needs: build_windows_x64
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: xmrig-windows-x64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
          generate_release_notes: true
